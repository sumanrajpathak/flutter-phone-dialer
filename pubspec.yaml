name: flutter_phone_dialer
description: "Open the phone dialer or place calls from your Flutter app on Android and iOS, with or without the CALL_PHONE permission."
version: 0.1.0
homepage: https://github.com/sumanrajpathak/flutter-phone-dialer
repository: https://github.com/sumanrajpathak/flutter-phone-dialer
issue_tracker: https://github.com/sumanrajpathak/flutter-phone-dialer/issues

topics:
  - phone
  - dialer
  - call
  - telephony

environment:
  sdk: ^3.1.0
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.sumanrajpathak.flutterphonedialer
        pluginClass: FlutterPhoneDialerPlugin
      ios:
        pluginClass: FlutterPhoneDialerPlugin
